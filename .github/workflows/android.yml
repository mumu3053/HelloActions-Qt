name: Build Qt Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 2. 安装 Qt 5.15.2 安卓工具链
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ github.workspace }}/qt'

      - name: 3. 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 4. 安装 Android SDK 与 NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r21e

      - name: 5. 配置安卓环境变量
        run: |
          echo "ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV

      - name: 安装安卓SDK基础组件
        run: sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: 6. 执行 qmake 生成 Makefile
        run: |
          BUILD_DIR=${{ github.workspace }}/build
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          qmake ${{ github.workspace }}/SkySide3gby_Net.pro -spec android-clang CONFIG+=release

      - name: 7. 并行编译源码
        run: |
          cd ${{ github.workspace }}/build
          make -j$(nproc)

      - name: 8. 打包生成 APK
        run: |
          cd ${{ github.workspace }}/build
          androiddeployqt \
            --input android-libSkySide3gby_Net.so-deployment-settings.json \
            --output android-build \
            --deployment bundled \
            --android-platform android-30 \
            --jdk $JAVA_HOME \
            --gradle

      - name: 9. 上传 APK 编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Qt5.15.2-Android-arm64-APK
          path: ${{ github.workspace }}/build/android-build/build/outputs/apk/release/*.apk
          retention-days: 7
