name: Build Qt Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-22.04

    # 统一路径，缓存和变量都认它俩
    env:
      QT_ROOT: ${{ github.workspace }}/../Qt
      SDK_ROOT: ${{ github.workspace }}/../android-sdk

    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. 恢复工具链缓存（Qt + SDK + NDK 一起存）
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../Qt
            ${{ github.workspace }}/../android-sdk
          key: qt5152-android30-ndk21e-v1

      - name: 3. 缓存未命中才装 Qt 5.15.2 安卓版
        if: steps.cache.outputs.cache-hit != 'true'
        uses: jurplel/install-qt-action@v2
        with:
          version: '5.15.2'
          target: 'android'

      - name: 4. 缓存未命中才装 Android SDK 与 NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          curl -fL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip
          unzip -q /tmp/ndk.zip -d "$SDK_ROOT"

      - name: 5. 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 6. 配置环境变量（缓存命中也必须执行）
        run: |
          echo "Qt5_Dir=$QT_ROOT/5.15.2/android" >> $GITHUB_ENV
          echo "Qt5_DIR=$QT_ROOT/5.15.2/android" >> $GITHUB_ENV
          echo "QT_PLUGIN_PATH=$QT_ROOT/5.15.2/android/plugins" >> $GITHUB_ENV
          echo "QML2_IMPORT_PATH=$QT_ROOT/5.15.2/android/qml" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/android-ndk-r21e" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/android-ndk-r21e" >> $GITHUB_ENV
          echo "$QT_ROOT/5.15.2/android/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: 7. qmake 生成 Makefile（只编 arm64-v8a）
        run: |
          mkdir -p build && cd build
          qmake ${{ github.workspace }}/SkySide3gby_Net.pro -spec android-clang CONFIG+=release "ANDROID_ABIS=arm64-v8a"

      - name: 8. 并行编译
        run: cd build && make -j$(nproc)

      - name: 9. 安装产物到打包目录（关键，缺它会报找不到二进制）
        run: cd build && make install INSTALL_ROOT="$PWD/android-build"

      - name: 10. 打包生成 APK
        run: |
          cd build
          SETTINGS=$(find . -maxdepth 1 -name "*deployment-settings.json" | head -n 1)
          androiddeployqt \
            --input "$SETTINGS" \
            --output android-build \
            --deployment bundled \
            --android-platform android-30 \
            --jdk $JAVA_HOME \
            --gradle

      - name: 11. 收集 APK 并打印位置
        run: |
          echo "===== 搜索所有 APK ====="
          find ${{ github.workspace }}/build -name "*.apk" -type f
          mkdir -p ${{ github.workspace }}/apk-out
          find ${{ github.workspace }}/build -name "*.apk" -type f -exec cp -v {} ${{ github.workspace }}/apk-out/ \;
          echo "===== 已收集到 ====="
          ls -la ${{ github.workspace }}/apk-out

      - name: 12. 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: Qt5.15.2-Android-arm64-APK
          path: ${{ github.workspace }}/apk-out/*.apk
          if-no-files-found: error
          retention-days: 7
