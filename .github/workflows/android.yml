name: Build Qt Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-latest
    container:
      image: stateoftheartio/qt5:5.15.2-android
      options: --privileged

    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v4

      - name: 2. 执行 qmake 生成 Makefile
        run: |
          BUILD_DIR=${{ github.workspace }}/build
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          /opt/qt/5.15.2/android_arm64_v8a/bin/qmake ${{ github.workspace }}/SkySide3gby_Net.pro -spec android-clang CONFIG+=release

      - name: 3. 并行编译源码
        run: |
          cd ${{ github.workspace }}/build
          make -j$(nproc)

      - name: 4. 打包生成 APK
        run: |
          cd ${{ github.workspace }}/build
          androiddeployqt \
            --input android-libSkySide3gby_Net.so-deployment-settings.json \
            --output android-build \
            --deployment bundled \
            --android-platform android-30 \
            --jdk $JAVA_HOME \
            --gradle

      - name: 5. 上传 APK 编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Qt5.15.2-Android-arm64-APK
          path: ${{ github.workspace }}/build/android-build/build/outputs/apk/release/*.apk
          retention-days: 7
