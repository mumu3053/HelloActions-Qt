name: Build Qt Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android arm64 APK
    runs-on: ubuntu-22.04

    steps:
      - name: 1. 拉取仓库源码
        uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: 2. 安装 Qt 5.15.2 安卓工具链
        uses: jurplel/install-qt-action@v2
        with:
          version: '5.15.2'
          target: 'android'

      - name: 3. 安装 JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 4. 安装 Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r21e

      - name: 5. 配置环境变量+自动安装缺失SDK组件（同一步骤执行，无PATH问题）
        run: |
          # 配置NDK路径
          echo "ANDROID_NDK_ROOT=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          
          # 定位Qt自带SDK根目录
          QT_SDK_ROOT="${{ env.Qt5_Dir }}/../android_sdk"
          echo "Qt SDK根目录: $QT_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$QT_SDK_ROOT" >> $GITHUB_ENV
          
          # 同时加入新旧版sdkmanager路径，兼容所有SDK版本
          export PATH="$QT_SDK_ROOT/cmdline-tools/latest/bin:$QT_SDK_ROOT/tools/bin:$QT_SDK_ROOT/platform-tools:$PATH"
          
          # 自动同意许可+安装需要的平台组件，不需要yes管道
          sdkmanager --install "platforms;android-30" "build-tools;30.0.3" --accept-licenses
          
          # 把路径写入全局PATH供后续步骤使用
          echo "$QT_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$QT_SDK_ROOT/tools/bin" >> $GITHUB_PATH
          echo "$QT_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: 6. 执行 qmake 生成 Makefile（仅编译arm64-v8a）
        run: |
          BUILD_DIR=${{ github.workspace }}/build
          mkdir -p $BUILD_DIR
          cd $BUILD_DIR
          qmake ${{ github.workspace }}/SkySide3gby_Net.pro -spec android-clang CONFIG+=release "ANDROID_ABIS=arm64-v8a"

      - name: 7. 并行编译源码
        run: |
          cd ${{ github.workspace }}/build
          make -j$(nproc)

      - name: 8. 安装编译产物到打包目录
        run: |
          cd ${{ github.workspace }}/build
          make install

      - name: 9. 打包生成 APK
        run: |
          cd ${{ github.workspace }}/build
          SETTINGS=$(find . -maxdepth 1 -name "*deployment-settings.json" | head -n 1)
          androiddeployqt \
            --input "$SETTINGS" \
            --output android-build \
            --deployment bundled \
            --android-platform android-30 \
            --jdk $JAVA_HOME \
            --gradle

      - name: 10. 上传 APK 编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Qt5.15.2-Android-arm64-APK
          path: ${{ github.workspace }}/build/android-build/build/outputs/apk/release/*.apk
          retention-days: 7
